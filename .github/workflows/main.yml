
name: Build ALI SHAMS VPN from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'ALI_SHAMS_VPN_3.5_GITHUB.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: |
          mkdir -p source
          unzip -q ALI_SHAMS_VPN_3.5_GITHUB.zip -d source

      - name: Build APK
        working-directory: source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALI-SHAMS-VPN-3.5-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
