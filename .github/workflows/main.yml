
name: Build ALI SHAMS VPN

on:
  workflow_dispatch:
  push:
    paths:
      - 'ALI_SHAMS_VPN_3.5_FIXED_BULK.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          mkdir -p android-project
          unzip -q ALI_SHAMS_VPN_3.5_FIXED_BULK.zip -d android-project
          test -f android-project/app/build.gradle.kts

      - name: Build APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALI-SHAMS-VPN-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
