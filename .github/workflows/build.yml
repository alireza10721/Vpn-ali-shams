
name: Build ALI SHAMS VPN

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE" || (echo "Project ZIP not found" && exit 1)
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR" || (echo "Project files not found" && exit 1)
          cp -a "$PROJECT_DIR"/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALI-SHAMS-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
